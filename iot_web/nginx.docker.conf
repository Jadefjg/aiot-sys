server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 根路径跳转到前端
    location = / {
        return 302 /iot/;
    }

    # Vue SPA（vite base = /iot/）
    location /iot/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /iot/index.html;
    }

    # 后端 API（保留 Host 端口，避免 307 重定向丢 :8080）
    location /api/ {
        proxy_pass http://backend_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend_app:8000/health;
        proxy_set_header Host $http_host;
    }

    location /docs {
        proxy_pass http://backend_app:8000/docs;
        proxy_set_header Host $http_host;
    }

    location /redoc {
        proxy_pass http://backend_app:8000/redoc;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://backend_app:8000/openapi.json;
        proxy_set_header Host $http_host;
    }

    location /firmware_files/ {
        proxy_pass http://backend_app:8000/;
        proxy_set_header Host $http_host;
    }
}
