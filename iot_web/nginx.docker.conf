upstream backend_upstream {
    server backend_app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 根路径跳转到前端
    location = / {
        return 302 /iot/;
    }

    # Vue SPA（vite base = /iot/）
    location /iot/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /iot/index.html;
    }

    # 入口 HTML 禁止缓存，避免引用已失效的旧 chunk hash
    location = /iot/ {
        root /usr/share/nginx/html;
        try_files /iot/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /iot/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 带 hash 的静态资源可长期缓存；缺失时返回 404（勿回退到 index.html）
    location /iot/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 后端 API（保留 Host 端口，避免 307 重定向丢 :8080）
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    location /health {
        proxy_pass http://backend_app:8000/health;
        proxy_set_header Host $http_host;
    }

    location /docs {
        proxy_pass http://backend_app:8000/docs;
        proxy_set_header Host $http_host;
    }

    location /redoc {
        proxy_pass http://backend_app:8000/redoc;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://backend_app:8000/openapi.json;
        proxy_set_header Host $http_host;
    }

    location /firmware_files/ {
        proxy_pass http://backend_app:8000/;
        proxy_set_header Host $http_host;
    }
}
