# 接入公共 MySQL/Redis；EMQX→Mosquitto；关闭 InfluxDB（2G 机器无法同时扛）
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.shared.yml up -d --no-build

services:
  mysql_db:
    profiles: ["isolated-middleware"]

  redis_cache:
    profiles: ["isolated-middleware"]

  influxdb:
    profiles: ["heavy-middleware"]

  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: iot_mqtt_broker
    restart: unless-stopped
    ports: !override
      - "${MQTT_PORT:-1883}:1883"
    volumes: !override
      - /opt/shared-infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    environment: !reset {}
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 32m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backend_app:
    mem_limit: 280m
    memswap_limit: 420m
    depends_on: !override
      mqtt_broker:
        condition: service_started
    environment:
      MYSQL_HOST: shared-mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: shared-redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://shared-redis:6379/1
      CELERY_RESULT_BACKEND: redis://shared-redis:6379/1
      MQTT_BROKER_HOST: mqtt_broker
      INFLUX_ENABLED: "false"
      INFLUX_URL: ""
    networks:
      - default
      - shared-infra

  celery_worker:
    mem_limit: 192m
    memswap_limit: 320m
    depends_on: !override
      backend_app:
        condition: service_healthy
    environment:
      MYSQL_HOST: shared-mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: shared-redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://shared-redis:6379/1
      CELERY_RESULT_BACKEND: redis://shared-redis:6379/1
      MQTT_BROKER_HOST: mqtt_broker
      INFLUX_ENABLED: "false"
      INFLUX_URL: ""
    networks:
      - default
      - shared-infra

  frontend_app:
    mem_limit: 48m
    memswap_limit: 96m

networks:
  shared-infra:
    external: true
    name: shared-infra

volumes:
  mosquitto_data:
