services:
  mysql_db:
    image: mysql:8.0
    container_name: iot_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_db}
      MYSQL_USER: ${MYSQL_USER:-iot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    container_name: iot_redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt_broker:
    image: emqx/emqx:5.3.0
    container_name: iot_mqtt_broker
    ports:
      - "1883:1883"
      - "18084:8083"
      - "18083:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data

  backend_app:
    build: .
    container_name: iot_backend_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - firmware_storage:/app/firmware_storage
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-iot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_db}
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      MQTT_BROKER_HOST: mqtt_broker
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CELERY_BROKER_URL: redis://redis_cache:6379/0
      CELERY_RESULT_BACKEND: redis://redis_cache:6379/0
      FIRMWARE_UPLOAD_DIR: /app/firmware_storage
      FIRMWARE_BASE_URL: http://localhost/firmware_files
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      mqtt_broker:
        condition: service_started

  celery_worker:
    build: .
    container_name: iot_celery_worker
    command: celery -A app.tasks.firmware_tasks.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - firmware_storage:/app/firmware_storage
    environment:
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-iot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_db}
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      MQTT_BROKER_HOST: mqtt_broker
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CELERY_BROKER_URL: redis://redis_cache:6379/0
      CELERY_RESULT_BACKEND: redis://redis_cache:6379/0
      FIRMWARE_UPLOAD_DIR: /app/firmware_storage
      FIRMWARE_BASE_URL: http://localhost/firmware_files
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      mqtt_broker:
        condition: service_started

volumes:
  mysql_data:
  emqx_data:
  firmware_storage:
