# AIoT 单体全栈 Docker Compose（本地 / 阿里云同一文件）
#
# 本地（默认，.env 中 COMPOSE_PROFILES=local）:
#   docker compose up -d --build
#
# 阿里云共享中间件（.env 中 COMPOSE_PROFILES=shared）:
#   接入已有 MySQL/Redis 网络 shared-infra，MQTT 用 Mosquitto，不启 InfluxDB
#   docker compose up -d --build

services:
  mysql_db:
    image: mysql:8.0
    container_name: iot_mysql_db
    profiles: ["local"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_db}
      MYSQL_USER: ${MYSQL_USER:-iot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis_cache:
    image: redis:7-alpine
    container_name: iot_redis_cache
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt_broker:
    image: emqx/emqx:5.3.0
    container_name: iot_mqtt_broker
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-18084}:8083"
      - "${MQTT_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  mqtt_lite:
    image: eclipse-mosquitto:2
    container_name: iot_mqtt_mosquitto
    profiles: ["shared"]
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ${MOSQUITTO_CONF:-/opt/shared-infra/mosquitto/mosquitto.conf}:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 32m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-iot}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-iot-influx-dev-token}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend_app:
    build:
      context: ./iot_backend
      dockerfile: Dockerfile
    container_name: iot_backend_app
    restart: unless-stopped
    environment: &backend_env
      MYSQL_HOST: ${MYSQL_HOST:-mysql_db}
      MYSQL_PORT: ${MYSQL_CONNECT_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-iot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iot_db}
      REDIS_HOST: ${REDIS_HOST:-redis_cache}
      REDIS_PORT: ${REDIS_CONNECT_PORT:-6379}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt_broker}
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis_cache:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis_cache:6379/0}
      FIRMWARE_UPLOAD_DIR: /app/firmware_storage
      FIRMWARE_BASE_URL: ${FIRMWARE_BASE_URL:-http://localhost/firmware_files}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080}
      PROJECT_NAME: ${PROJECT_NAME:-IoT System}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-iot-influx-dev-token}
      INFLUX_ORG: ${INFLUX_ORG:-iot}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
    volumes:
      - firmware_storage:/app/firmware_storage
    depends_on:
      mysql_db:
        condition: service_healthy
        required: false
      redis_cache:
        condition: service_healthy
        required: false
      mqtt_broker:
        condition: service_started
        required: false
      mqtt_lite:
        condition: service_started
        required: false
      influxdb:
        condition: service_started
        required: false
    networks:
      - default
      - shared-infra
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  celery_worker:
    build:
      context: ./iot_backend
      dockerfile: Dockerfile
    container_name: iot_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.firmware_tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      <<: *backend_env
    volumes:
      - firmware_storage:/app/firmware_storage
    depends_on:
      mysql_db:
        condition: service_healthy
        required: false
      redis_cache:
        condition: service_healthy
        required: false
      backend_app:
        condition: service_healthy
    networks:
      - default
      - shared-infra

  frontend_app:
    build:
      context: ./iot_web
      dockerfile: Dockerfile
    container_name: iot_frontend_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend_app:
        condition: service_healthy

networks:
  shared-infra:
    name: ${SHARED_NETWORK:-aiot-shared-placeholder}
    external: ${SHARED_EXTERNAL:-false}

volumes:
  mysql_data:
  emqx_data:
  firmware_storage:
  influx_data:
  mosquitto_data:
